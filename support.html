<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridPlayer Support - 技术支持</title>
  <meta name="description" content="Contact GridPlayer support for help, feedback, feature requests, privacy policy, and terms of service.">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #0b0f17;
      --text: #f6f7fb;
      --muted: #aeb6c8;
      --soft: #dce7ff;
      --line: rgba(255, 255, 255, 0.12);
      --blue: #7db7ff;
      --orange: #ff9f5a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 14% 14%, rgba(125, 183, 255, 0.22), transparent 34%),
        radial-gradient(circle at 82% 18%, rgba(255, 159, 90, 0.16), transparent 30%),
        linear-gradient(180deg, #0b0f17 0%, #111827 48%, #090c12 100%);
    }

    a {
      color: inherit;
    }

    .page {
      width: min(100% - 100px, 1180px);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
      padding: 22px 0 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: fit-content;
      text-decoration: none;
    }

    .brand img,
    .app-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.28);
    }

    .brand strong {
      display: block;
      font-size: 18px;
      line-height: 1.2;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .top-actions {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: 0;
    }

    nav a,
    .lang-toggle button {
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      padding: 8px 13px;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease;
    }

    nav a:hover,
    .lang-toggle button:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    .lang-toggle {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
    }

    .lang-toggle button {
      min-width: 44px;
      padding: 6px 10px;
    }

    .lang-toggle button[aria-pressed="true"] {
      background: #f6f7fb;
      color: #0b0f17;
      font-weight: 700;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 440px);
      gap: clamp(30px, 5vw, 72px);
      align-items: center;
      min-height: calc(100svh - 84px);
      padding: clamp(42px, 8vh, 86px) 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      margin-bottom: 24px;
      padding: 7px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--soft);
      font-size: 13px;
      backdrop-filter: blur(4px);
    }

    .badge img {
      width: 18px;
      height: 18px;
      border-radius: 5px;
    }

    h1 {
      max-width: 720px;
      margin-bottom: 22px;
      font-size: clamp(42px, 6vw, 72px);
      font-weight: 850;
      letter-spacing: 0;
      line-height: 1.04;
    }

    .hero-copy {
      max-width: 640px;
      margin-bottom: 30px;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      border: 0;
      background: linear-gradient(135deg, #ffffff, #e2edff);
      color: #0b0f17;
    }

    .btn-primary:hover {
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .support-panel {
      position: relative;
      overflow: hidden;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.035)),
        rgba(9, 13, 21, 0.78);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 24px 52px rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(14px);
    }

    .support-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(125, 183, 255, 0.12), transparent 42%, rgba(255, 159, 90, 0.08));
      pointer-events: none;
    }

    .panel-head,
    .support-card {
      position: relative;
      z-index: 1;
    }

    .panel-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .panel-head strong {
      display: block;
      font-size: 18px;
      line-height: 1.2;
    }

    .panel-head span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .support-card {
      display: block;
      padding: 18px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.09);
      text-decoration: none;
    }

    .support-card:first-of-type {
      border-top: 0;
    }

    .label {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .value {
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
    }

    .support-card:hover .value {
      color: #dce7ff;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 34px 0 48px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: #8e97aa;
      font-size: 13px;
    }

    footer div:last-child {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    footer a {
      color: #b9c7ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        min-height: auto;
      }
    }

    @media (max-width: 680px) {
      .page {
        width: min(100% - 36px, 1180px);
      }

      header,
      .top-actions,
      nav {
        width: 100%;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .top-actions,
      nav {
        justify-content: flex-start;
      }

      nav a {
        padding-inline: 10px;
      }

      main {
        padding: 34px 0;
      }

      .actions {
        width: 100%;
      }

      .btn {
        flex: 1 1 170px;
      }

      .support-panel {
        padding: 22px;
      }

      footer {
        flex-direction: column;
        align-items: flex-start;
      }

      footer div:last-child {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a href="https://garycny.github.io/gridplayer-legal/gridplayer.html" class="brand" aria-label="GridPlayer">
        <img src="favicon.png" alt="GridPlayer Logo">
        <span>
          <strong>GridPlayer</strong>
          <small data-i18n="brandSubtitle">格子播放器</small>
        </span>
      </a>

      <div class="top-actions">
        <nav aria-label="Primary navigation">
          <a href="https://garycny.github.io/gridplayer-legal/gridplayer.html" data-i18n="navHome">首页</a>
          <a href="https://garycny.github.io/gridplayer-legal/privacy.html" data-i18n="navPrivacy">隐私政策</a>
          <a href="https://garycny.github.io/gridplayer-legal/terms.html" data-i18n="navTerms">服务协议</a>
          <a href="https://garycny.github.io/gridplayer-legal/support.html" data-i18n="navSupport">技术支持</a>
        </nav>
        <div class="lang-toggle" aria-label="Language">
          <button type="button" data-lang-button="zh" aria-pressed="true">中</button>
          <button type="button" data-lang-button="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main>
      <section aria-labelledby="support-title">
        <div class="badge">
          <img src="favicon.png" alt="">
          <span data-i18n="badge">GridPlayer 技术支持</span>
        </div>
        <h1 id="support-title" data-i18n="heroTitle">需要帮助？我们在这里。</h1>
        <p class="hero-copy" data-i18n="heroCopy">如果你在连接音乐源、管理曲库、离线缓存或使用播放器时遇到问题，可以通过邮件联系我们。</p>
        <div class="actions">
          <a href="mailto:support@gridnet.top" class="btn btn-primary" data-i18n="emailAction">发送邮件</a>
          <a href="https://garycny.github.io/gridplayer-legal/gridplayer.html" class="btn btn-secondary" data-i18n="backAction">返回首页</a>
        </div>
      </section>

      <aside class="support-panel" aria-label="Support resources">
        <div class="panel-head">
          <img class="app-icon" src="favicon.png" alt="">
          <div>
            <strong>GridPlayer</strong>
            <span data-i18n="panelSubtitle">支持与文档</span>
          </div>
        </div>

        <a class="support-card" href="mailto:support@gridnet.top">
          <div class="label" data-i18n="emailLabel">支持邮箱</div>
          <div class="value">support@gridnet.top</div>
        </a>

        <a class="support-card" href="https://garycny.github.io/gridplayer-legal/privacy.html">
          <div class="label" data-i18n="privacyLabel">隐私政策</div>
          <div class="value" data-i18n="privacyValue">查看隐私政策</div>
        </a>

        <a class="support-card" href="https://garycny.github.io/gridplayer-legal/terms.html">
          <div class="label" data-i18n="termsLabel">服务协议</div>
          <div class="value" data-i18n="termsValue">查看服务协议</div>
        </a>
      </aside>
    </main>

    <footer>
      <div>© <span id="year"></span> GridPlayer. <span data-i18n="rights">All rights reserved.</span></div>
      <div>
        <a href="https://garycny.github.io/gridplayer-legal/privacy.html" data-i18n="footerPrivacy">隐私政策</a>
        <a href="https://garycny.github.io/gridplayer-legal/terms.html" data-i18n="footerTerms">服务协议</a>
        <a href="https://garycny.github.io/gridplayer-legal/gridplayer.html" data-i18n="footerHome">首页</a>
      </div>
    </footer>
  </div>

  <script>
    const content = {
      zh: {
        title: "GridPlayer 技术支持",
        description: "联系 GridPlayer 技术支持，获取帮助、反馈问题、提交功能建议，并查看隐私政策与服务协议。",
        brandSubtitle: "格子播放器",
        navHome: "首页",
        navSupport: "技术支持",
        navPrivacy: "隐私政策",
        navTerms: "服务协议",
        badge: "GridPlayer 技术支持",
        heroTitle: "需要帮助？我们在这里。",
        heroCopy: "如果你在连接音乐源、管理曲库、离线缓存或使用播放器时遇到问题，可以通过邮件联系我们。",
        emailAction: "发送邮件",
        backAction: "返回首页",
        panelSubtitle: "支持与文档",
        emailLabel: "支持邮箱",
        privacyLabel: "隐私政策",
        privacyValue: "查看隐私政策",
        termsLabel: "服务协议",
        termsValue: "查看服务协议",
        rights: "All rights reserved.",
        footerPrivacy: "隐私政策",
        footerTerms: "服务协议",
        footerHome: "首页"
      },
      en: {
        title: "GridPlayer Support",
        description: "Contact GridPlayer support for help, feedback, feature requests, privacy policy, and terms of service.",
        brandSubtitle: "Personal music player",
        navHome: "Home",
        navSupport: "Support",
        navPrivacy: "Privacy",
        navTerms: "Terms",
        badge: "GridPlayer Support",
        heroTitle: "Need help? We are here.",
        heroCopy: "If you run into issues with music sources, library management, offline cache, or playback, contact us by email.",
        emailAction: "Email support",
        backAction: "Back home",
        panelSubtitle: "Support and documents",
        emailLabel: "Support email",
        privacyLabel: "Privacy Policy",
        privacyValue: "View Privacy Policy",
        termsLabel: "Terms of Service",
        termsValue: "View Terms of Service",
        rights: "All rights reserved.",
        footerPrivacy: "Privacy Policy",
        footerTerms: "Terms of Service",
        footerHome: "Home"
      }
    };

    function preferredLanguage() {
      const urlLang = new URLSearchParams(window.location.search).get("lang");
      const storedLang = localStorage.getItem("gridplayer-language");
      const browserLang = navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
      return ["zh", "en"].includes(urlLang) ? urlLang : (["zh", "en"].includes(storedLang) ? storedLang : browserLang);
    }

    function setLanguage(lang) {
      const dictionary = content[lang] || content.zh;
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = dictionary.title;
      document.querySelector('meta[name="description"]').setAttribute("content", dictionary.description);
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        node.textContent = dictionary[node.dataset.i18n] || "";
      });
      document.querySelectorAll("[data-lang-button]").forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.langButton === lang ? "true" : "false");
      });
      localStorage.setItem("gridplayer-language", lang);
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    document.querySelectorAll("[data-lang-button]").forEach((button) => {
      button.addEventListener("click", () => setLanguage(button.dataset.langButton));
    });
    setLanguage(preferredLanguage());
  </script>
</body>
</html>
